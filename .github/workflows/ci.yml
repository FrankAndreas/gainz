name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/frankandreas/gainz/fitness-backend
  FRONTEND_IMAGE: ghcr.io/frankandreas/gainz/fitness-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r backend/requirements.txt ruff==0.17.3

      # The same lint as .githooks/pre-commit
      - run: ruff check backend

      - run: python -m pytest backend -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend --ignore-scripts

      - run: npm audit --prefix frontend --audit-level=high

      - run: npm run --prefix frontend lint

      - run: npm test --prefix frontend

      # Type-checks and builds the bundle the frontend image ships
      - run: npm run --prefix frontend build

  # Browser tests: Playwright starts the family hub (the logins, from a family-hub checkout), the backend (a fresh data
  # folder, never backend/data) and the frontend itself (e2e/)
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: FrankAndreas/family-hub
          path: family-hub
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          pip install -r backend/requirements.txt
          # The hub in an environment of its own: its pinned versions never clash with the tracker's
          python -m venv "$RUNNER_TEMP/hub-venv"
          "$RUNNER_TEMP/hub-venv/bin/pip" install -r family-hub/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # Only the headless browser: the runner image already has Chrome's system libraries
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: |
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix e2e
          cd e2e && npx playwright install --only-shell chromium
      - run: cd e2e && E2E_PYTHON=python HUB_PYTHON="$RUNNER_TEMP/hub-venv/bin/python" HUB_DIR="$GITHUB_WORKSPACE/family-hub" npm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  build-and-push:
    needs: [test-backend, test-frontend, e2e]
    runs-on: ubuntu-latest
    # Only push images on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge Dependabot patch and minor updates once all jobs above pass; majors stay manual
  dependabot-automerge:
    needs: [test-backend, test-frontend, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
