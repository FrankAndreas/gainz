# Dependabot configuration for automated dependency updates

version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    assignees:
      - "FrankAndreas"
    groups:
      # Non-major updates in one PR, majors on their own
      pip-non-major:
        update-types: ["minor", "patch"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    assignees:
      - "FrankAndreas"
    groups:
      # react and react-dom must have the exact same version
      react:
        patterns:
          - "react"
          - "react-dom"
      npm-non-major:
        update-types: ["minor", "patch"]
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "docker"
