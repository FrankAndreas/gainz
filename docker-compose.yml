version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.backend
    volumes:
      - ..:/workspaces:cached
    working_dir: /workspaces
    command: sleep infinity
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/workspaces
    networks:
      - fitness-network

  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.frontend
    volumes:
      - ..:/workspaces:cached
    working_dir: /workspaces
    command: sleep infinity
    ports:
      - "3000:3000"
    networks:
      - fitness-network

networks:
  fitness-network:
    driver: bridge
